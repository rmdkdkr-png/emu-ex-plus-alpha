name: EX Emulators

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ── 0) 파일 점검 (20초) ────────────────────────────────────────────
  # 올린 파일이 모자라거나 옛 판이면 여기서 바로 죽는다.
  # 20분 빌드가 끝난 뒤에 C++ 오류로 죽는 걸 막으려고 둔 것.
  preflight:
    name: SS2 파일 점검
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: SS2 파일 14개가 다 있고 짝이 맞는지 본다
      run: |
        miss=0
        need() { [ -f "$1" ] || { echo "::error::빠진 파일 → $1"; miss=1; }; }
        has()  { grep -q "$2" "$1" 2>/dev/null || { echo "::error::$1 이(가) 옛 판이다 — '$2' 가 없다"; miss=1; }; }

        for f in \
          NGP.emu/src/CMakeLists.txt \
          NGP.emu/src/main/Main.cc \
          NGP.emu/src/main/system.ccm \
          NGP.emu/src/main/options.cc \
          NGP.emu/src/main/EmuMenuViews.cc \
          NGP.emu/src/main/AppMeta.cc \
          NGP.emu/src/ss2sp/ss2sp.c \
          NGP.emu/src/ss2sp/ss2sp.h \
          NGP.emu/src/ss2sp/ss2sp_moves.h \
          NGP.emu/src/ss2comm/ss2comm.c \
          NGP.emu/src/ss2comm/ss2comm.h \
          NGP.emu/src/ss2comm/ss2comm_lines.h \
          NGP.emu/src/ss2comm/ss2comm_font.h \
          NGP.emu/src/ss2comm/ss2comm_font11.h \
          NGP.emu/src/ss2comm/ss2comm_duo.h \
          NGP.emu/res/overlays/gpOverlay.png ; do need "$f"; done

        has NGP.emu/src/CMakeLists.txt        'ss2sp/ss2sp.c'
        has NGP.emu/src/CMakeLists.txt        'ss2comm/ss2comm.c'
        has NGP.emu/src/main/system.ccm       'ss2commEnabled'
        has NGP.emu/src/main/system.ccm       'ss2CommitPix'
        has NGP.emu/src/main/Main.cc          'ss2CommitPix'
        has NGP.emu/src/main/Main.cc          'ss2comm_draw_enable'
        has NGP.emu/src/main/Main.cc          'videoAspectRatioScale'
        has NGP.emu/src/main/options.cc       'CFGKEY_SS2COMM_DRAW'
        # v0.7 — 해설자 15명 · 교대 버튼
        has NGP.emu/src/ss2comm/ss2comm_lines.h 'SS2COMM_SPK_N 15'
        has NGP.emu/src/ss2comm/ss2comm.c       'ss2comm_next_speaker'
        has NGP.emu/src/ss2comm/ss2comm.c       'flow_arc'
        has NGP.emu/src/ss2comm/ss2comm.c       'duo_after'
        has NGP.emu/src/ss2comm/ss2comm_duo.h   'DUOLINE'
        has NGP.emu/src/ss2comm/ss2comm.h       'ss2comm_speaker_count'
        has NGP.emu/src/main/system.ccm         'CommNext'
        has NGP.emu/src/main/AppMeta.cc         'commKeyInfo'
        has NGP.emu/src/main/EmuMenuViews.cc    'ss2comm_speaker_name'

        if [ "$miss" != 0 ]; then
          echo "::error::SS2 파일이 모자라거나 짝이 안 맞습니다. 3_ngpemu 의 NGP.emu 폴더를 통째로 다시 올리세요."
          exit 1
        fi
        echo "✅ SS2 파일 16개 · 짝 다 맞음 (v0.7 해설자 15명 · 흐름 · 짝꿍) — 빌드로 넘어갑니다"

  # ── 1) 밑작업 (NDK·imagine·EmuFramework) ──────────────────────────
  # imagine / EmuFramework 가 그대로면 지난번 캐시를 그냥 쓴다.
  # NGP.emu 만 고친 판올림에서는 이 잡이 통째로 건너뛰어진다 (20분 → 1분).
  build:
    name: Build base
    needs: [preflight]
    runs-on: ubuntu-latest
    outputs:
      basekey: ${{ steps.basekey.outputs.key }}
    steps:
    - name: Checkout emu-ex-plus-alpha repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: 캐시 열쇠 만들기
      id: basekey
      run: echo "key=base-v1-${{ hashFiles('imagine/**', 'EmuFramework/**') }}" >> "$GITHUB_OUTPUT"
    - name: 밑작업 캐시가 이미 있나 본다
      id: basecache
      uses: actions/cache/restore@v4
      with:
        path: ./
        key: ${{ steps.basekey.outputs.key }}
        lookup-only: true
    - name: Decode debug keystore
      if: steps.basecache.outputs.cache-hit != 'true'
      env:
        DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
      run: |
        if [ -z "$DEBUG_KEYSTORE" ]
        then
          echo 'No debug keystore value'
        else
          echo "$DEBUG_KEYSTORE" | base64 --decode > .debug.keystore
          mkdir -p ~/.android
          mv .debug.keystore ~/.android/debug.keystore
        fi
    - name: Install build dependencies
      if: steps.basecache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends autoconf automake autopoint bash gcc-arm-linux-gnueabi file gawk gettext git libtool libtool-bin make nasm pkg-config unzip wget
    - name: Install Latest CMake
      if: steps.basecache.outputs.cache-hit != 'true'
      uses: lukka/get-cmake@latest
      with:
        # imagine/cmake/config.cmake 가 CMAKE_EXPERIMENTAL_CXX_IMPORT_STD 를
        # 451f2fe2-a8a2-47c3-bc32-94786d8fc91b 로 박아 두었고, 이 UUID는 CMake 4.3 전용이다.
        # @latest 가 4.4+ 를 깔면 UUID가 안 맞아 `import std` 가 꺼지고,
        # CXX_MODULE_STD 를 켠 타깃(imagine / emuframework)에서 configure 가 죽는다.
        cmakeVersion: "~4.3.0"
    - name: Set up JDK 21
      if: steps.basecache.outputs.cache-hit != 'true'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Set up environment
      if: steps.basecache.outputs.cache-hit != 'true'
      run: |
        mkdir imagine-sdk
        NDK_VERSION='r30-beta1'
        wget "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
        unzip android-ndk-${NDK_VERSION}-linux.zip
        rm android-ndk-${NDK_VERSION}-linux.zip
        mv android-ndk-${NDK_VERSION} android-ndk
        GITHUB_ENV_FILE=env.github
        echo "ANDROID_NDK_PATH=${{ github.workspace }}/android-ndk" >> "$GITHUB_ENV_FILE"
        echo "EMUFRAMEWORK_PATH=${{ github.workspace }}/EmuFramework" >> "$GITHUB_ENV_FILE"
        echo "IMAGINE_PATH=${{ github.workspace }}/imagine" >> "$GITHUB_ENV_FILE"
        echo "IMAGINE_SDK_PATH=${{ github.workspace }}/imagine-sdk" >> "$GITHUB_ENV_FILE"
        echo "COMMIT_PREFIX=$(echo ${{ github.sha }} | cut -c1-8)" >> "$GITHUB_ENV_FILE"
        cat "$GITHUB_ENV_FILE" >> $GITHUB_ENV
    - name: Run script
      if: steps.basecache.outputs.cache-hit != 'true'
      working-directory: imagine/bundle/all
      run: |
        ./makeAll-android.sh install
      shell: bash
    - name: Build environment
      if: steps.basecache.outputs.cache-hit != 'true'
      run: |
        $IMAGINE_PATH/android.sh config
        $IMAGINE_PATH/android.sh installLinks --config Release
        $EMUFRAMEWORK_PATH/android.sh config
        $EMUFRAMEWORK_PATH/android.sh installLinks --config Release
    - name: Keep cache small
      if: steps.basecache.outputs.cache-hit != 'true'
      run: rm -rf .git
    - name: Save cache
      if: steps.basecache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ./
        key: ${{ steps.basekey.outputs.key }}

  # ── 2) APK 만들기 (NGP.emu 하나만) ────────────────────────────────
  build_images:
    name: Build images
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["NGP.emu"]
    steps:
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends autoconf automake autopoint bash gcc-arm-linux-gnueabi file gawk gettext git libtool libtool-bin make nasm pkg-config unzip wget
    - name: Install Latest CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "~4.3.0"
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Restore cache
      uses: actions/cache/restore@v4
      with:
        path: ./
        key: ${{ needs.build.outputs.basekey }}
        fail-on-cache-miss: true
    - name: 이번 커밋의 NGP.emu 로 덮어쓴다
      # 캐시는 imagine/EmuFramework 만 재활용하는 것이고,
      # NGP.emu 는 통째로 지금 커밋의 것이어야 한다.
      #
      # 예전에는 NGP.emu/src 만 덮어썼는데, 캐시 열쇠가
      # hashFiles('imagine/**', 'EmuFramework/**') 라 NGP.emu 가 안 들어간다.
      # 그래서 src 바깥(res/overlays/gpOverlay.png · android.mk · 아이콘)이
      # 캐시가 처음 만들어진 시점에 얼어붙어, 고쳐도 릴리스에 안 실렸다.
      # 실제로 gpOverlay.png 가 그렇게 옛 그림인 채로 나가고 있었다.
      uses: actions/checkout@v4
      with:
        path: __fresh
    - name: 덮어쓰기
      run: |
        rm -rf NGP.emu
        cp -a __fresh/NGP.emu NGP.emu
        rm -rf __fresh
    - name: Set up environment
      run: |
        GITHUB_ENV_FILE=env.github
        cat "$GITHUB_ENV_FILE" >> $GITHUB_ENV
    - name: Create EX-Emulators directory
      run: mkdir EX-Emulators
    - name: Build NGP.emu
      if: ${{ matrix.image == 'NGP.emu' }}
      working-directory: ${{ matrix.image }}
      run: |
        make -f android.mk android-apk CONFIG=Release V=1 -j`nproc`
        cp build/android/build/outputs/apk/release/NgpEmu-release.apk "../EX-Emulators/NgpEmu-${COMMIT_PREFIX}.apk"
    - name: Upload EX-Emulators artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.image }}
        path: EX-Emulators/

  # ── 3) 릴리스에 APK 붙이기 ────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, build_images]
    if: github.ref == 'refs/heads/master'
    steps:
    - name: Checkout emu-ex-plus-alpha repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: EX-Emulators
        merge-multiple: true
    - name: Re-ZIP artifacts
      working-directory: EX-Emulators
      run: |
        mkdir ../dist
        COMMIT_PREFIX=$(echo ${{ github.sha }} | cut -c1-8)
        for artifact in *.apk
        do
          file_name="${artifact%.apk}"
          echo "-> Creating ${file_name//-${COMMIT_PREFIX}/}.zip"
          zip "../dist/${file_name//-${COMMIT_PREFIX}/}.zip" "${file_name}.apk"
        done
        cp NgpEmu-*.apk ../dist/NgpEmu.apk
    - name: Update Git Tag
      run: |
        git tag -f Pre-release
        git push -f origin Pre-release
    - name: Create Release
      # v1.16.0
      uses: ncipollo/release-action@440c8c1cb0ed28b9f43e4d1d670870f059653174
      with:
        prerelease: true
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: false
        tag: Pre-release
        artifacts: "dist/*.zip,dist/*.apk"
